name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[agent,relay,dev]"
      - run: CODEX_WORKSPACE_SOURCE="$PWD" python -m unittest discover -s tests -t . -v
      - name: Install wheel and exercise fresh setup outside checkout
        run: |
          python -m build --wheel
          pip install --force-reinstall --no-deps dist/*.whl
          cp tests/integration/test_fresh_install.py "$RUNNER_TEMP/test_fresh_install.py"
          cd "$RUNNER_TEMP"
          python -m unittest test_fresh_install -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[agent]"
      - run: npm ci --prefix web --ignore-scripts
      - run: npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium webkit && npx playwright test
        env:
          CRYPTO_TEST_PYTHON: python
      - run: cd web && npx playwright test --browser webkit tests/crypto.spec.ts tests/pairing.spec.ts tests/vault.spec.ts tests/encrypted-attachments.spec.ts
        env:
          CRYPTO_TEST_PYTHON: python
